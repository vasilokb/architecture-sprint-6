apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
spec:
  replicas: 1  # Начальное количество реплик
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
      - name: scaletestapp
        image: shestera/scaletestapp
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "30Mi"  # Лимит памяти
          requests:
            memory: "20Mi"  # Запрос памяти (чуть меньше лимита для стабильности)